<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WHOO TOTAL MASTER</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{--line-g:#5ac45a;--line-bg:#7494c0;--dark:#1e2a38;--gray:#8e8e93;--msg-me:#a0ea9d;--msg-op:#ffffff}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;height:100vh;display:flex;flex-direction:column;font-size:14px;user-select:none}
.h{background:var(--dark);color:#fff;text-align:center;height:50px;line-height:50px;position:relative;font-weight:bold;font-size:16px}
.tab-m{display:flex;background:#fff;border-bottom:1px solid #e5e5e5}
.tab{flex:1;padding:15px;text-align:center;font-weight:bold;cursor:pointer;color:var(--gray);border-bottom:3px solid transparent}
.tab.a{color:var(--line-g);border-bottom-color:var(--line-g)}
.view{flex:1;overflow-y:auto;display:none;background:#fff}.view.a{display:block}
.item{display:flex;align-items:center;padding:14px;border-bottom:1px solid #f2f2f6;cursor:pointer}
.box{background:#f9f9fb;padding:16px;border-radius:14px;border:1px solid #efeff4;margin:14px;display:flex;flex-direction:column;gap:12px}
.btn{background:var(--line-g);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
#chat{display:none;position:absolute;inset:0;background:var(--line-bg);z-index:20;flex-direction:column}
.msg-r{display:flex;width:100%;align-items:flex-end;gap:8px;margin:10px 0;padding:0 14px;box-sizing:border-box}
.msg{padding:10px 14px;border-radius:16px;max-width:65%;word-break:break-all;font-size:15px;line-height:1.4}
.msg.me{background:var(--msg-me);border-radius:16px 16px 2px 16px}.msg.op{background:var(--msg-op);border-radius:16px 16px 16px 2px}
.nb{position:absolute;top:10px;padding:6px 12px;border:0;border-radius:6px;color:#fff;font-weight:bold;cursor:pointer}
.input-area{padding:12px;background:#f5f5f7;display:flex;flex-direction:column;gap:8px;border-top:1px solid #ddd}
#callScreen{display:none;position:fixed;inset:0;background:#131c26;color:#fff;z-index:99;flex-direction:column;align-items:center;justify-content:space-between;padding:50px 20px;box-sizing:border-box}
#ld{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:16px}
video,img{max-width:200px;border-radius:12px;display:block;margin:4px 0}
</style></head><body>

<div id="ld"><div id="ldt">データを読み込み中...</div><div id="ldp" style="margin-top:10px;color:var(--line-g)">0%</div></div>

<div id="callScreen">
    <div class="call-info" style="text-align:center;margin-top:50px">
        <div id="callTargetName" style="font-size:26px;font-weight:bold">友達</div>
        <div id="callStatus" style="font-size:16px;color:#8e8e93;margin-top:10px">呼び出し中...</div>
    </div>
    <button class="btn" style="background:#ff3b30;width:64px;height:64px;border-radius:50%;font-size:22px" onclick="endCall()">❌</button>
</div>

<div class="h" id="mt">トーク一覧</div>
<div class="tab-m" id="ts"><div class="tab a" id="t1" onclick="tab(1)">トーク</div><div class="tab" id="t2" onclick="tab(2)">設定・追加</div></div>
<div id="v1" class="view a"></div>
<div id="v2" class="view">
    <div class="box" style="align-items:center">
        <div style="font-weight:bold;font-size:15px">マイ番号: <span id="mc" style="color:var(--line-g);font-size:18px"></span></div>
        <div style="font-weight:bold;color:#ff9500">所持コイン: <span id="coinCnt">50</span> コイン</div>
    </div>
    <div class="box">名前:<input id="ni" style="padding:10px;border-radius:6px;border:1px solid #ddd" onchange="upNm()"></div>
    <div class="box">友達の番号(11桁)を追加:<div style="display:flex;gap:8px"><input id="fi" placeholder="070xxxxxxxx" style="flex:1;padding:10px;border-radius:6px;border:1px solid #ddd"><button class="btn" onclick="addF()">追加</button></div></div>
</div>

<div id="chat">
    <div class="h">
        <button class="nb" style="left:10px;background:#445566" onclick="closeC()">◀ 戻る</button>
        <span id="ct"></span>
        <button class="nb" style="right:10px;background:#007aff" onclick="startCall()">📞 通話</button>
    </div>
    <div id="cb" style="flex:1;overflow-y:auto;padding:14px 0;display:flex;flex-direction:column"></div>
    <div class="input-area">
        <div style="display:flex;gap:8px">
            <input type="file" id="ii" accept="image/*,video/*" style="display:none" onchange="sdMedia(this)">
            <button class="btn" style="background:#007aff;padding:8px 12px" onclick="document.getElementById('ii').click()">📷 画像/動画</button>
            <input id="mi" placeholder="メッセージを入力..." style="flex:1;padding:10px;border-radius:22px;border:1px solid #ddd;outline:none" onkeypress="if(event.key==='Enter')sdMsg()">
            <button class="btn" style="border-radius:50%;width:40px;height:40px;padding:0" onclick="sdMsg()">送</button>
        </div>
    </div>
</div>

<script>
const PFX="wh070_v5_";
// 🚀 ストレージキーを変更し、古いデータを完全リセット
let isFirst = !localStorage.getItem(PFX+"init");
let myC = localStorage.getItem(PFX+"c") || "070" + Math.floor(10000000+Math.random()*90000000).toString();
let myN = localStorage.getItem(PFX+"n") || "ユーザー";
let db = JSON.parse(localStorage.getItem(PFX+"db") || "{}");
let coins = parseInt(localStorage.getItem(PFX+"coins") ?? "50");
let lastDay = localStorage.getItem(PFX+"last_day") || "";

// 🚀 毎日50コインにリセットする処理
let today = new Date().toDateString();
if(lastDay !== today){ coins = 50; localStorage.setItem(PFX+"last_day", today); localStorage.setItem(PFX+"coins", "50"); }

localStorage.setItem(PFX+"init", "true");
localStorage.setItem(PFX+"c", myC);

document.getElementById("mc").innerText = myC.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
document.getElementById("ni").value = myN;
document.getElementById("coinCnt").innerText = coins;

// 🚀 起動時ダミーロード処理（初回100MB、2回目以降10000KB）
let targetBytes = isFirst ? 100 * 1024 * 1024 : 10000 * 1024, loadedBytes = 0;
let ldInterval = setInterval(() => {
    loadedBytes += targetBytes / 20;
    let pct = Math.min(100, Math.floor((loadedBytes / targetBytes) * 100));
    document.getElementById("ldp").innerText = pct + "%";
    if(pct >= 100){ clearInterval(ldInterval); document.getElementById("ld").style.display = "none"; }
}, 50);

let peer = new Peer(PFX+myC), conns = {}, ac = null, stream = null, callObj = null, callTimer = null, costTimer = null;

setInterval(() => {
    localStorage.setItem(PFX+"db", JSON.stringify(db));
    localStorage.setItem(PFX+"coins", coins.toString());
    document.getElementById("coinCnt").innerText = coins;
    if(ac) rMsgs(); else rList();
}, 1000);

peer.on('open', () => { Object.keys(db).forEach(c => tryC(c)); rList(); });
peer.on('connection', c => setup(c, c.peer.replace(PFX,"")));
peer.on('call', call => {
    if(confirm(`🔔 着信: 【${db[call.peer.replace(PFX,"")]?.name || "070ユーザー"}】からの通話。出ますか？`)){
        navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(s => {
            stream = s; document.getElementById("callTargetName").innerText = db[call.peer.replace(PFX,"")]?.name || "ユーザー";
            document.getElementById("callStatus").innerText = "通話中..."; document.getElementById("callScreen").style.display = "flex";
            call.answer(s); hCall(call);
        });
    } else { call.close(); }
});

function tryC(c){ if(!conns[c]) try{ setup(peer.connect(PFX+c,{reliable:true}),c) }catch(e){} }
function setup(c,code){ if(!c)return;
    c.on('open', () => {
        conns[code] = c;
        if(!db[code]) db[code] = {code:code,name:"070ユーザー",history:[]};
        c.send({type:'prof',name:myN}); rList(); if(ac===code) openC(code);
    });
    c.on('data', d => {
        if(d.type==='prof'&&db[code]){ db[code].name = d.name; if(ac===code) document.getElementById("ct").innerText = d.name; }
        else if(d.type==='msg'){
            if(db[code].history.some(m => m.id === d.id)) return;
            db[code].history.push(d);
        }
    });
    c.on('close', () => delete conns[code]); c.on('error', () => delete conns[code]);
}

function upNm(){ myN = document.getElementById("ni").value.trim() || "ユーザー"; localStorage.setItem(PFX+"n", myN); Object.keys(conns).forEach(c => conns[c]?.open && conns[c].send({type:'prof',name:myN})); }
function tab(n){ document.getElementById("v1").classList.toggle("a",n===1); document.getElementById("v2").classList.toggle("a",n===2); document.getElementById("t1").classList.toggle("a",n===1); document.getElementById("t2").classList.toggle("a",n===2); if(n===1) rList(); }

// 🚀 存在しない番号のチェック機能付き友達追加
function addF(){
    let c = document.getElementById("fi").value.trim().replace(/-/g,"");
    if(c.length !== 11 || c === myC){ alert("番号が正しくありません。"); return; }
    
    // PeerJSにそのIDが存在するか確認（シミュレート接続試行）
    let testConn = peer.connect(PFX+c, {reliable:true});
    let timeout = setTimeout(() => {
        testConn.close();
        alert("番号を確認して下さい。"); // 存在しない、またはオフライン
    }, 2500);

    testConn.on('open', () => {
        clearTimeout(timeout);
        db[c] = {code:c,name:"070ユーザー",history:[]};
        setup(testConn, c);
        document.getElementById("fi").value = ''; tab(1);
    });
}

function rList(){
    let v = document.getElementById("v1"); v.innerHTML = "";
    Object.keys(db).forEach(k => {
        let f = db[k], l = f.history[f.history.length-1], txt = l ? (l.isV?"[動画]":(l.isI?"[画像]":l.txt)) : "履歴なし";
        v.innerHTML += `<div class="item" onclick="openC('${k}')"><div style="flex:1"><div style="font-weight:bold;font-size:15px">${f.name} (${f.code})</div><div style="color:#666;font-size:13px;margin-top:2px">${txt}</div></div></div>`;
    });
}
function openC(c){ ac = c; document.getElementById("chat").style.display = "flex"; document.getElementById("ts").style.display = "none"; document.getElementById("ct").innerText = db[c].name; rMsgs(); }
function closeC(){ ac = null; document.getElementById("chat").style.display = "none"; document.getElementById("ts").style.display = "flex"; rList(); }

// 🚀 バックグラウンド送信判断つき送信システム
function exSd(m){
    if(!conns[ac] || !conns[ac].open){
        if(!confirm("相手がオフラインですが、バックグラウンド送信しますか？")){ return; }
        tryC(ac); // 裏で再接続を試みる
    }
    db[ac].history.push(m); rMsgs();
    if(conns[ac] && conns[ac].open) conns[ac].send(m);
}

function sdMsg(){ let i = document.getElementById("mi"), t = i.value.trim(); if(!t)return; exSd({id:Math.random().toString(36).substr(2,9),type:'msg',txt:t}); i.value=''; }
function sdMedia(i){ if(!i.files[0])return; let f = i.files[0], isV = f.type.includes('video'), r = new FileReader(); r.onload = e => { exSd({id:Math.random().toString(36).substr(2,9),type:'msg',txt:e.target.result,isI:!isV,isV:isV}); }; r.readAsDataURL(f); i.value=''; }

function rMsgs(){
    let b = document.getElementById('cb'); b.innerHTML = ""; if(!ac||!db[ac])return;
    db[ac].history.forEach(m => {
        let r = document.createElement('div'); r.className = "msg-r"; r.style.justifyContent = m.type==='msg'?'flex-end':'flex-start';
        let e = document.createElement('div'); e.className = "msg me";
        if(m.isV) e.innerHTML = `<video src="${m.txt}" controls playsinline style="width:180px">`;
        else if(m.isI) e.innerHTML = `<img src="${m.txt}" style="max-width:180px">`;
        else e.innerText = m.txt; r.appendChild(e); b.appendChild(r);
    });
}

// 🚀 コイン制連動型通話機能（30秒ごとに2コイン）
function startCall(){
    if(coins < 2){ alert("コインが足りません。"); return; }
    if(!conns[ac]?.open){ alert("相手がオフラインです。"); return; }
    navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(s => {
        stream = s; document.getElementById("callTargetName").innerText = db[ac].name;
        document.getElementById("callStatus").innerText = "呼び出し中..."; document.getElementById("callScreen").style.display = "flex";
        hCall(peer.call(PFX+ac, s));
    });
}
function hCall(c){
    callObj = c;
    c.on('stream', s => {
        document.getElementById("callStatus").innerText = "通話中";
        let elapsed = 0;
        costTimer = setInterval(() => {
            elapsed++;
            if(elapsed % 30 === 0){
                coins -= 2; document.getElementById("coinCnt").innerText = coins;
                if(coins < 2){ alert("コイン不足のため通話を切断します。"); endCall(); }
            }
        }, 1000);
    });
    c.on('close', endCall); c.on('error', endCall);
}
function endCall(){
    clearInterval(costTimer); document.getElementById("callScreen").style.display = "none";
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    if(callObj){ callObj.close(); callObj = null; }
}
</script></body></html>
