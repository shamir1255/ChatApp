<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LINE風P2P (完全版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #7494c0; --green: #25d366; --dark: #1e2a38; }
        body { font-family: sans-serif; margin: 0; background: #f4f5f7; user-select: none; font-size: 13px; }
        .container { max-width: 500px; margin: 0 auto; background: var(--bg); height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .header { background: var(--dark); color: white; text-align: center; font-weight: bold; height: 38px; line-height: 38px; position: relative; }
        .tab-menu { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #777; font-weight: bold; }
        .tab.active { color: var(--dark); border-bottom: 2px solid var(--green); }
        .content { flex: 1; overflow-y: auto; display: none; background: #fff; }
        .content.active { display: block; }
        .list-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #f8f8f8; cursor: pointer; }
        .avatar-container { position: relative; width: 34px; height: 34px; margin-right: 10px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; background: #95a5a6; }
        .badge { position: absolute; top: -4px; right: -4px; background: #ff3b30; color: white; border-radius: 10px; min-width: 15px; height: 15px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 1px solid white; }
        .item-info { flex: 1; min-width: 0; }
        .settings-pane { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .setting-box { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .settings-pane input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; text-align: center; }
        .btn { padding: 6px 12px; background: var(--dark); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #ff3b30; }
        #chat-window { display: none; flex-direction: column; height: 100%; background: var(--bg); position: absolute; width: 100%; z-index: 20; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg-row { display: flex; width: 100%; justify-content: flex-end; align-items: flex-end; }
        .msg-row.friend { justify-content: flex-start; }
        .msg { padding: 6px 10px; border-radius: 12px; max-width: 70%; word-break: break-all; }
        .msg.me { background: #85e29e; border-top-right-radius: 2px; }
        .msg.friend { background: #fff; border-top-left-radius: 2px; }
        .msg img { max-width: 130px; max-height: 130px; border-radius: 8px; display: block; margin: 2px 0; cursor: zoom-in; }
        .status { font-size: 9px; color: rgba(255,255,255,0.8); margin-right: 4px; text-align: right; font-weight: bold; min-width: 55px; }
        .nav-btn { position: absolute; top: 4px; padding: 4px 8px; background: rgba(30,42,56,0.85); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 40; }
        #back-btn { left: 6px; } #del-btn { left: 55px; background: #ff3b30; } #call-btn { right: 6px; background: var(--green); }
        .compact-input-cluster { position: absolute; right: 12px; top: 55%; display: flex; flex-direction: column; gap: 5px; z-index: 30; }
        .compact-input-cluster input[type="text"] { width: 54px; height: 54px; border: 2px solid rgba(0,0,0,0.2); border-radius: 8px; text-align: center; outline: none; }
        .compact-input-cluster button { width: 54px; height: 34px; border: none; background: var(--green); color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .compact-input-cluster .btn-img { background: #3498db; font-size: 14px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loading-box { background: #fff; padding: 20px; border-radius: 12px; text-align: center; width: 200px; }
        .bar-bg { background: #e0e0e0; height: 6px; border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .bar-fill { background: var(--green); height: 100%; width: 0%; transition: width 0.05s linear; }
        .img-preview-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .img-preview-overlay img { max-width: 95vw; max-height: 90vh; object-fit: contain; }
        #call-overlay { display: none; flex-direction: column; background: rgba(30,42,56,0.95); color: white; font-size: 16px; }
    </style>
</head>
<body>

<div class="overlay" id="loader"><div class="loading-box">⚙️ システム起動中<div class="bar-bg"><div class="bar-fill" id="bar"></div></div><div id="status">読込中...</div></div></div>
<div class="img-preview-overlay" id="img-preview" onclick="this.style.display='none'"><img id="preview-target" src=""></div>

<!-- 📞 通話画面用オーバレイ -->
<div class="overlay" id="call-overlay">
    <div id="call-status" style="margin-bottom:20px; text-align:center;">📞 通話中...</div>
    <button class="btn btn-danger" onclick="endCall()">通話終了</button>
</div>

<div class="container">
    <div class="header" id="main-title">トーク一覧</div>
    <div class="tab-menu" id="tabs">
        <div class="tab active" id="t-chats" onclick="tab('chats')">トーク</div>
        <div class="tab" id="t-friends" onclick="tab('friends')">設定・追加</div>
    </div>
    <div id="v-chats" class="content active"><div id="chats-list"></div></div>
    <div id="v-friends" class="content">
        <div class="settings-pane">
            <div class="setting-box">あなたのコード: <strong id="my-code">---</strong></div>
            <div class="setting-box">名前変更:<br><input type="text" id="name-input" onchange="updateMyName()"></div>
            <div class="setting-box">友達追加:<div style="display:flex;gap:4px;margin-top:4px;"><input type="text" id="f-input" placeholder="3桁" maxlength="3"><button class="btn" onclick="addFriend()">追加</button></div></div>
            <div class="setting-box" style="text-align:center;"><button class="btn btn-danger" onclick="cleanCache()">🧹 キャッシュクリーン (全削除)</button></div>
        </div>
    </div>

    <div id="chat-window">
        <div class="header" id="chat-title">
            <button class="nav-btn" id="back-btn" onclick="closeChat()">◀戻る</button>
            <button class="nav-btn" id="del-btn" onclick="deleteFriend()">削除</button>
            <span id="chat-user-name">チャット</span>
            <button class="nav-btn" id="call-btn" onclick="startCall()">📞通話</button>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="compact-input-cluster">
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendImage(this)">
            <button class="btn-img" onclick="document.getElementById('file-input').click()">📷</button>
            <input type="text" id="msg-input" placeholder="入力" maxlength="500" onkeypress="if(event.key==='Enter') sendMsg()">
            <button id="send-btn" onclick="sendMsg()">送信</button>
        </div>
    </div>
</div>

<script>
    let myCode = localStorage.getItem("code3") || Math.floor(100 + Math.random() * 900).toString();
    let myName = localStorage.getItem("myName") || "ユーザー(" + myCode + ")";
    localStorage.setItem("code3", myCode);
    document.getElementById("my-code").innerText = myCode;
    document.getElementById("name-input").value = myName;

    const PREFIX = "line_m3_";
    let db = JSON.parse(localStorage.getItem("db3")) || {};
    let peer = null, conns = {}, activeCode = null, cooling = false, timerInterval = null;
    let myStream = null, activeCall = null;

    function preload(cb) {
        let size = 0, total = 20;
        let i = setInterval(() => {
            size += 4; document.getElementById("bar").style.width = (size/total)*100 + "%";
            if(size >= total) { clearInterval(i); document.getElementById("loader").style.display="none"; cb(); }
        }, 40);
    }

    function initPeer() {
        peer = new Peer(PREFIX + myCode);
        peer.on('open', () => {
            Object.keys(db).forEach(c => { if(!conns[c]) setup(peer.connect(PREFIX + c, {reliable:true}), c); });
        });
        peer.on('connection', c => setup(c, c.peer.replace(PREFIX,"")));
        
        // 📞 電話着信イベントの監視
        peer.on('call', async call => {
            if (confirm("📞 電話が着信しました。出ますか？")) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                call.answer(myStream);
                handleCall(call);
            } else { call.close(); }
        });
    }

    function setup(c, code) {
        c.on('open', () => {
            conns[code] = c;
            if (!db[code]) { db[code] = { code: code, name: "友達(" + code + ")", history: [], unread: 0 }; save(); }
            c.send({ type: 'sync-name', name: myName });
            renderList();
        });
        c.on('data', d => {
            if (d.type === 'sync-name') {
                if(db[code]) { db[code].name = d.name; save(); renderList(); }
            } else if (d.type === 'msg') {
                if (!db[code] || db[code].history.some(m => m.id === d.id)) return;
                db[code].history.push({ id: d.id, sender: 'friend', text: d.text, isImg: d.isImg, read: null });
                if (activeCode === code && document.visibilityState === "visible") c.send({type:'read', t:Date.now()});
                else db[code].unread++;
                save(); renderList(); if(activeCode===code) renderMsgs();
            } else if (d.type === 'read') {
                if(db[code]) db[code].history.forEach(m => { if(m.sender==='me' && !m.read) m.read = d.t; });
                save(); if(activeCode===code) renderMsgs();
            }
        });
        c.on('close', () => { delete conns[code]; renderList(); });
    }

    function updateMyName() {
        myName = document.getElementById("name-input").value.trim() || "ユーザー(" + myCode + ")";
        localStorage.setItem("myName", myName);
        Object.keys(conns).forEach(c => { if(conns[c].open) conns[c].send({ type: 'sync-name', name: myName }); });
    }

    function addFriend() {
        let c = document.getElementById("f-input").value.trim();
        if(c.length !== 3 || c === myCode || db[c]) { document.getElementById("f-input").value = ''; return; }
        setup(peer.connect(PREFIX + c, {reliable:true}), c);
        document.getElementById("f-input").value = ''; tab('chats');
    }

    // 友達削除機能
    function deleteFriend() {
        if(!activeCode || !confirm("この友達を削除しますか？トーク履歴も消去されます。")) return;
        if(conns[activeCode]) conns[activeCode].close();
        delete db[activeCode]; delete conns[activeCode];
        save(); closeChat();
    }

    // キャッシュクリーン（全削除）
    function cleanCache() {
        if(!confirm("⚠️ すべてのトーク履歴、友達リスト、設定を完全に消去しますか？")) return;
        localStorage.clear(); location.reload();
    }

    // 📞 音声通話の開始・制御
    async function startCall() {
        if(!activeCode || !conns[activeCode]?.open) { alert("相手がオンラインではないため通話できません"); return; }
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            let call = peer.call(PREFIX + activeCode, myStream);
            handleCall(call);
        } catch (e) { alert("マイクの許可が必要です"); }
    }

    function handleCall(call) {
        activeCall = call;
        document.getElementById("call-overlay").style.display = "flex";
        call.on('stream', remoteStream => {
            let audio = document.createElement('audio');
            audio.srcObject = remoteStream; audio.play();
        });
        call.on('close', () => { endCall(); });
    }

    function endCall() {
        document.getElementById("call-overlay").style.display = "none";
        if(myStream) { myStream.getTracks().forEach(t => t.stop()); myStream = null; }
        if(activeCall) { activeCall.close(); activeCall = null; }
    }

    function tab(name) {
        document.getElementById("v-chats").classList.toggle("active", name==='chats');
        document.getElementById("v-friends").classList.toggle("active", name==='friends');
        document.getElementById("t-chats").classList.toggle("active", name==='chats');
        document.getElementById("t-friends").classList.toggle("active", name==='friends');
        document.getElementById("main-title").innerText = name==='chats' ? "トーク一覧" : "設定・追加";
        if(name==='chats') renderList();
    }

    function renderList() {
        let container = document.getElementById("chats-list"); container.innerHTML = "";
        Object.keys(db).forEach(c => {
            let f = db[c], online = conns[c]?.open, last = f.history[f.history.length-1];
            let txt = last ? (last.isImg ? "[写真]" : last.text) : "履歴なし";
            let item = document.createElement("div"); item.className = "list-item";
            item.onclick = () => openChat(c);
            item.innerHTML = `
                <div class="avatar-container">
                    <div class="avatar" style="background:${online?'#25d366':'#95a5a6'}">👤</div>
                    ${f.unread ? `<div class="badge">${f.unread}</div>` : ''}
                </div>
                <div class="item-info"><b>${f.name}</b><br><span style="color:#888;font-size:11px;">${txt}</span></div>`;
            container.appendChild(item);
        });
    }

    function openChat(code) {
        if(!db[code]) return; activeCode = code;
        document.getElementById("chat-window").style.display = "flex";
        document.getElementById("tabs").style.display = "none";
        document.getElementById("chat-user-name").innerText = db[code].name;
        db[code].unread = 0; save();
        if(conns[code]?.open) conns[code].send({type:'read', t:Date.now()});
        renderMsgs();
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(renderMsgs, 1000);
    }

    function closeChat() { 
        activeCode = null; if(timerInterval) clearInterval(timerInterval);
        document.getElementById("chat-window").style.display = "none"; 
        document.getElementById("tabs").style.display = "flex"; tab('chats'); 
    }

    function sendMsg() {
        if(cooling || !activeCode) return;
        let input = document.getElementById('msg-input'), text = input.value.trim();
        if(!text) return; executeSend(text, false); input.value = '';
    }

    // 📷 写真送信（バグの原因になる超巨大化・過度な圧縮を廃止、安定通常サイズで送信）
    function sendImage(input) {
        if (!input.files || !input.files[0] || !activeCode) return;
        let reader = new FileReader();
        reader.onload = function (e) {
            let img = new Image();
            img.src = e.target.result;
            img.onload = function () {
                let canvas = document.createElement('canvas');
                let max = 400; // 確実に通信がクラッシュしない最適通常サイズ
                let w = img.width, h = img.height;
                if (w > h) { if (w > max) { h *= max / w; w = max; } }
                else { if (h > max) { w *= max / h; h = max; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                executeSend(canvas.toDataURL('image/jpeg', 0.6), true);
            };
        };
        reader.readAsDataURL(input.files[0]);
        input.value = '';
    }

    function executeSend(payload, isImg) {
        if(!activeCode || !db[activeCode]) return;
        cooling = true; document.getElementById('send-btn').disabled = true;
        let id = Math.random().toString(36).substring(2,9);
        db[activeCode].history.push({ id: id, sender: 'me', text: payload, isImg: isImg, read: null });
        save(); renderMsgs();
        if(conns[activeCode]?.open) conns[activeCode].send({type:'msg', id:id, text:payload, isImg:isImg});
        setTimeout(() => { cooling = false; document.getElementById('send-btn').disabled = false; }, 400);
    }

    function renderMsgs() {
        let box = document.getElementById('chat-box'); if(!activeCode || !db[activeCode]) return;
        let isAtBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 30;
        box.innerHTML = ""; let now = Date.now();
        db[activeCode].history.forEach(m => {
            let row = document.createElement('div'); row.className = `msg-row ${m.sender==='me'?'':'friend'}`;
            if(m.sender==='me') {
                let st = document.createElement('div'); st.className = "status";
                if(m.read) {
                    let diff = Math.floor((now - m.read) / 1000);
                    st.innerText = diff < 5 ? "既読\n(今)" : (diff < 60 ? `既読\n(${diff}秒前)` : `既読\n(${Math.floor(diff/60)}分前)`);
                } else { st.innerText = "未読"; }
                row.appendChild(st);
            }
            let el = document.createElement('div'); el.className = `msg ${m.sender==='me'?'me':'friend'}`;
            if(m.isImg) {
                el.innerHTML = `<img src="${m.text}" onclick="document.getElementById('preview-target').src='${m.text}';document.getElementById('img-preview').style.display='flex';" loading="lazy">`;
            } else { el.innerText = m.text; }
            row.appendChild(el); box.appendChild(row);
        });
        if(isAtBottom) box.scrollTop = box.scrollHeight;
    }

    function save() { localStorage.setItem("db3", JSON.stringify(db)); }
    document.addEventListener("DOMContentLoaded", () => preload(() => { initPeer(); tab('chats'); }));
</script>
</body>
</html>
