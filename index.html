<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOO</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{margin:0;font:14px sans-serif;background:#f0f2f5}
.view{display:none;height:100vh;flex-direction:column}.view.a{display:flex}
.msg-area{flex:1;overflow-y:auto;padding:10px}
.msg{padding:8px;margin:5px;border-radius:10px;max-width:75%;background:#fff}
.me{background:#5ac45a;color:#fff;align-self:flex-end}
.controls{background:#fff;padding:10px;border-top:1px solid #ddd;display:flex;flex-direction:column;gap:5px}
</style></head><body>

<div id="v1" class="view a">
    <div style="padding:10px;background:#fff">番号:<b id="myId"></b><br><input id="fi" placeholder="070-xxxx-xxxx"><button onclick="addF()">追加</button></div>
    <div id="list" style="flex:1"></div>
</div>

<div id="v2" class="view">
    <div class="h" onclick="document.getElementById('v2').classList.remove('a');document.getElementById('v1').classList.add('a')">◀戻る</div>
    <div id="cb" class="msg-area"></div>
    <div class="controls">
        <input id="mi" placeholder="メッセージを入力">
        <div style="display:flex;gap:5px">
            <button onclick="sd('msg')">送信</button>
            <button onclick="recV()">📹動画</button>
            <button onclick="recA()">🎙️録音</button>
            <button onclick="callV()">📞通話</button>
        </div>
    </div>
</div>

<script>
// 番号を必ず070-から始まる8桁に固定
const myC = "070" + Math.floor(10000000 + Math.random() * 89999999);
document.getElementById("myId").innerText = myC;
const peer = new Peer("wh_" + myC);
let db = JSON.parse(localStorage.getItem("db")||"{}"), cur = null, conns = {};

peer.on('connection', c => {
    c.on('data', d => {
        if(!db[c.peer.replace("wh_","")]) db[c.peer.replace("wh_","")] = {h:[]};
        db[c.peer.replace("wh_","")].h.push(d);
        rC(); alert("新着メッセージ！");
    });
    conns[c.peer.replace("wh_","")] = c;
});

function addF(){
    let t = document.getElementById("fi").value.replace("-","");
    let c = peer.connect("wh_" + t);
    conns[t] = c; db[t] = {h:[]}; rL();
}

function sd(type){
    let val = document.getElementById("mi").value;
    conns[cur].send({type, val, from: myC});
    db[cur].h.push({type, val, me:true});
    rC();
}

// 録音・動画機能（MediaRecorder使用）
async function recA(){
    let s = await navigator.mediaDevices.getUserMedia({audio:true});
    let rec = new MediaRecorder(s);
    let chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => conns[cur].send({type:'audio', val:URL.createObjectURL(new Blob(chunks))});
    rec.start(); setTimeout(()=>rec.stop(), 3000);
}

function recV(){
    navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(s=>{
        let rec = new MediaRecorder(s);
        let chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => conns[cur].send({type:'video', val:URL.createObjectURL(new Blob(chunks))});
        rec.start(); setTimeout(()=>rec.stop(), 3000);
    });
}

function rC(){
    document.getElementById("cb").innerHTML = db[cur].h.map(m=>
        `<div class="msg ${m.me?'me':''}">${m.type=='msg'?m.val:m.type+'送信'}</div>`
    ).join("");
}
function rL(){
    document.getElementById("list").innerHTML = Object.keys(db).map(k=>`<div onclick="op('${k}')">友達:${k}</div>`).join("");
}
function op(id){ cur = id; document.getElementById("v1").classList.remove('a'); document.getElementById("v2").classList.add('a'); rC(); }
</script></body></html>
